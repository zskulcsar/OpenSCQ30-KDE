name: test

on:
  push:
    paths-ignore: &push_paths_ignore
      - "*.md"
      - docs/**
      - fastlane/**
      - screenshots/**
      - tools/**
      - packaging/**
  pull_request:
    paths-ignore: *push_paths_ignore

permissions:
  contents: read

jobs:
  test-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install basic requirements
        run: sudo apt-get install -y pkg-config libdbus-1-dev libxkbcommon-dev
      - name: Install just
        run: sudo snap install just --classic
      - name: Install rust
        run: rustup install --profile minimal stable
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2.86.6
        with:
          tool: cargo-llvm-cov
      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run all rust tests
        run: just test-cov
      - name: Generate HTML test coverage report
        run: just test-cov-report html
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: target/llvm-cov/html/

  test-kde:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install KDE build requirements
        run: |
          curl --fail --location https://archive.neon.kde.org/public.key | sudo gpg --dearmor --yes --output /usr/share/keyrings/kde-neon-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/kde-neon-archive-keyring.gpg] https://archive.neon.kde.org/user noble main" | sudo tee /etc/apt/sources.list.d/kde-neon.list > /dev/null
          apt-get update
          sudo apt-get install -y \
            appstream \
            build-essential \
            ca-certificates \
            cmake \
            curl \
            git \
            kf6-kirigami-dev \
            libdbus-1-dev \
            libxkbcommon-dev \
            pkg-config \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-declarative-dev-tools
      - name: Install pinned Rust and Just
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          "$HOME/.cargo/bin/rustup" toolchain install 1.97.1 --profile minimal
          "$HOME/.cargo/bin/rustup" default 1.97.1
          "$HOME/.cargo/bin/cargo" install just --version 1.58.0 --locked
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Run Rust bridge tests
        run: cargo test -p openscq30_gui_kde --lib
      - name: Run QML tests and lint
        run: just kde::test
      - name: Build KDE frontend
        run: just build-gui-fast kde
      - name: Validate AppStream metadata
        run: appstreamcli validate gui/resources/com.oppzippy.OpenSCQ30.metainfo.xml
      - name: Smoke-test installed KDE frontend
        run: |
          install_root="$RUNNER_TEMP/openscq30-kde-install"
          cmake --install gui-kde/build --prefix "$install_root"
          if QT_QPA_PLATFORM=offscreen timeout 10 "$install_root/bin/openscq30-gui"; then
            exit 1
          else
            test "$?" -eq 124
          fi
